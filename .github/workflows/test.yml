name: Build & Test
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    env:
      GO_ENV: test
    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5.3.1
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
        id: go
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: "Build Web"
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
      - name: Get dependencies
        run: go get -v -t -d ./...
      - name: Test
        run: go test ./...
